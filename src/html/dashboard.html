<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Pro CRM — Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://api.level2d.tech https://oauth2.googleapis.com https://accounts.google.com; font-src 'self' https://cdn.jsdelivr.net;">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="dashboard-body">

<!-- Boot Screen -->
<div id="boot-screen">
    <div class="boot-glow-br"></div>
    <div class="boot-content">
        <div class="boot-logo-wrap">
            <img src="../assets/icon.ico" alt="Motor Pro Logo" class="boot-logo-img">
            <div class="boot-logo-text">MOTOR PRO <span>GERENCIAMENTO</span></div>
        </div>
        <div class="boot-divider">
            <div class="boot-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
</div>

<div class="db-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sb-logo">
            <img src="../assets/icon.ico" alt="Motor Pro Logo" class="sb-logo-image">
            <h1>MOTOR PRO <span>CRM</span></h1>
        </div>

        <div class="sb-oficina">
            <div class="sb-oficina-avatar" id="sbOficinaAvatar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 9l1-6h16l1 6"/>
                    <path d="M3 9a2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0 2 2 2 2 0 0 0 2-2"/>
                    <path d="M5 11v8a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-8"/>
                </svg>
            </div>
            <div class="sb-oficina-info">
                <div class="sb-oficina-label">OFICINA ATIVA</div>
                <div class="sb-oficina-name" id="sbOficinaName">Carregando...</div>
            </div>
        </div>

        <nav class="sb-nav">
            <div class="nav-section">PRINCIPAL</div>
            <div class="nav-item active" data-page="dashboard">
                <i class="ti ti-layout-dashboard"></i><span>Serviços</span>
            </div>
            <div class="nav-item" data-page="clientes">
                <i class="ti ti-users"></i><span>Clientes</span>
            </div>
            <div class="nav-item" data-page="ordens">
                <i class="ti ti-clipboard-list"></i><span>Ordens de Serviço</span>

            </div>

            <div class="nav-section">GESTÃO</div>
            <div class="nav-item" data-page="veiculos">
                <i class="ti ti-car"></i><span>Veículos</span>
            </div>
            <div class="nav-item" data-page="relatorios">
                <i class="ti ti-chart-bar"></i><span>Relatórios</span>
            </div>
            <div class="nav-item" data-page="contatos">
                <i class="ti ti-address-book"></i><span>Contatos</span>
            </div>

            <div class="nav-section">SISTEMA</div>
            <div class="nav-item" data-page="configuracoes">
                <i class="ti ti-settings"></i><span>Configurações</span>
            </div>
        </nav>

        <div class="sb-bottom">
            <button class="btn-logout" id="logoutBtn">
                <i class="ti ti-logout"></i> SAIR DO SISTEMA
            </button>
        </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="db-content">
        <div id="metricsContainer"></div>
        <div id="dbContentInner">
            <!-- Conteúdo dinâmico renderizado por JavaScript -->
        </div>
    </main>
</div>

<!-- Pop-up -->
<div id="popup-overlay" class="hidden">
    <div id="popup-card">
        <div class="popup-icon" id="popup-icon"></div>
        <h3 id="popup-title"></h3>
        <p id="popup-message"></p>
        <button id="popup-close-btn">OK</button>
    </div>
</div>

<script src="../js/pages/boot.js" type="module"></script>
<script src="../js/dashboard/dashboard.js" type="module"></script>
</body>
</html>
